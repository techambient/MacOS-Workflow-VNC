name: mac
on: 
  workflow_dispatch:

jobs:
  build:
    # Swapped out macos-13 for the supported Intel replacement
    runs-on: macos-15-intel
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Core Configuration
      # Add the third secret string to the argument line right here:
      run: |
        chmod +x configure.sh
        ./configure.sh "${{ secrets.VNC_USER_PASSWORD }}" "${{ secrets.VNC_PASSWORD }}" "${{ secrets.NGROK_AUTH_TOKEN }}"


    - name: Keep Active
      run: |
        echo "Server is running! Check your ngrok dashboard for the TCP address."
        sleep 21600
